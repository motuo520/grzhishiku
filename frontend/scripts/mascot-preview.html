<!doctype html>
<html><head><style>
body{margin:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#fff;border-radius:50%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
</style></head><body>
<div class="box"><svg viewBox="0 0 120 120" width="200" height="200" class="mascot" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2a2a2a" />
        <stop offset="55%" stop-color="#1a1a1a" />
        <stop offset="100%" stop-color="#0d0d0d" />
      </linearGradient>
      <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff5eb" />
        <stop offset="100%" stop-color="#f8dec6" />
      </linearGradient>
      <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="100%" stop-color="#f2f2f2" />
      </linearGradient>
      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <g fill="none" stroke="#5a4a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- Long black hair - back layer, shoulders length -->
      <path
        d="M26 52 C18 68 16 92 24 108 C30 116 44 114 50 104 C54 96 54 84 52 74"
        fill="url(#hairGrad)"
        fill-opacity="0.92"
      />
      <path
        d="M94 52 C102 68 104 92 96 108 C90 116 76 114 70 104 C66 96 66 84 68 74"
        fill="url(#hairGrad)"
        fill-opacity="0.92"
      />
      <!-- Hair shine lines -->
      <path d="M32 62 C28 78 30 96 36 106" stroke-opacity="0.25" stroke-width="1" stroke="#ffffff" />
      <path d="M88 62 C92 78 90 96 84 106" stroke-opacity="0.25" stroke-width="1" stroke="#ffffff" />

      <!-- Hair top volume -->
      <path
        d="M26 54 C26 24 42 10 60 10 C78 10 94 24 94 54 C94 66 90 76 86 82"
        fill="url(#hairGrad)"
        fill-opacity="0.95"
      />

      <!-- Face - cute oval -->
      <path
        d="M40 48 C40 74 48 88 60 88 C72 88 80 74 80 48 C80 32 72 24 60 24 C48 24 40 32 40 48 Z"
        fill="url(#skinGrad)"
      />

      <!-- Bangs / forehead hair -->
      <path
        d="M32 46 C36 28 48 22 60 22 C72 22 84 28 88 46 C88 50 86 54 82 50 C78 36 70 32 60 32 C50 32 42 36 38 50 C34 54 32 50 32 46"
        fill="url(#hairGrad)"
        fill-opacity="0.98"
      />
      <path d="M44 38 C48 34 54 34 58 38" stroke-opacity="0.4" stroke-width="1" stroke="#ffffff" />
      <path d="M62 38 C66 34 72 34 76 38" stroke-opacity="0.4" stroke-width="1" stroke="#ffffff" />

      <!-- Side strands framing face -->
      <path d="M38 52 C34 66 34 82 40 94" stroke-width="1.2" />
      <path d="M82 52 C86 66 86 82 80 94" stroke-width="1.2" />

      <!-- Eyes - natural almond shape -->
      <path d="M46 54 C49 51 53 51 56 54 C53 57 49 57 46 54 Z" fill="#3d2b20" stroke="#3d2b20" stroke-width="1" />
      <path d="M64 54 C67 51 71 51 74 54 C71 57 67 57 64 54 Z" fill="#3d2b20" stroke="#3d2b20" stroke-width="1" />
      <circle cx="51" cy="53" r="1.2" fill="white" stroke="none" />
      <circle cx="69" cy="53" r="1.2" fill="white" stroke="none" />

      <!-- Eyelashes -->
      <path d="M46 52 C48 51 51 51 53 52" stroke-width="1" />
      <path d="M64 52 C66 51 69 51 71 52" stroke-width="1" />

      <!-- Eyebrows - gentle arches -->
      <path d="M44 46 C48 43 54 43 56 46" stroke-width="1.2" />
      <path d="M64 46 C66 43 72 43 76 46" stroke-width="1.2" />

      <!-- Nose - tiny -->
      <path d="M60 63 C59 66 58 67 60 68" stroke-width="1" />

      <!-- Smile -->
      <path d="M54 74 C57 78 63 78 66 74" stroke="#d67b7b" stroke-width="1.5" fill="#f5b0b0" fill-opacity="0.5" />
      <path d="M55 74 L65 74" stroke-width="0.8" stroke-opacity="0.4" stroke="#d67b7b" />

      <!-- Blush -->
      <ellipse cx="44" cy="68" rx="5.5" ry="3.5" fill="#f5b0b0" fill-opacity="0.3" stroke="none" />
      <ellipse cx="76" cy="68" rx="5.5" ry="3.5" fill="#f5b0b0" fill-opacity="0.3" stroke="none" />

      <!-- Neck -->
      <path d="M54 86 L54 94" stroke-width="1.5" />
      <path d="M66 86 L66 94" stroke-width="1.5" />

      <!-- White T-shirt with round collar -->
      <path
        d="M40 96 C46 92 54 92 60 94 C66 92 74 92 80 96 C86 100 90 110 92 118 C82 116 70 114 60 114 C50 114 38 116 28 118 C30 110 34 100 40 96"
        fill="url(#shirtGrad)"
        fill-opacity="0.95"
      />
      <!-- Collar -->
      <path d="M50 94 C54 100 66 100 70 94" stroke-width="1.2" stroke="#e0e0e0" />
      <!-- Subtle shirt folds -->
      <path d="M48 103 C54 106 66 106 72 103" stroke-opacity="0.18" stroke-width="0.8" stroke="#d8d8d8" />
      <path d="M50 109 C55 111 65 111 70 109" stroke-opacity="0.12" stroke-width="0.7" stroke="#d8d8d8" />

      <!-- Right arm giving thumbs up -->
      <path d="M78 102 C88 98 96 88 98 78" stroke-width="1.4" />
      <path d="M78 102 C82 108 90 108 94 104" stroke-width="1.4" />
      <!-- Hand -->
      <path d="M94 76 C96 72 100 72 102 76 C104 80 102 84 98 86" fill="url(#skinGrad)" stroke-width="1.2" />
      <!-- Thumb up -->
      <path d="M96 74 C96 66 98 58 100 54 C102 50 106 50 108 54 C110 58 108 66 106 74" fill="url(#skinGrad)" stroke-width="1.2" />
      <!-- Fingers folded -->
      <path d="M98 82 C100 80 104 80 106 82" stroke-width="1.2" />
      <path d="M98 86 C100 84 104 84 106 86" stroke-width="1.2" />
      <path d="M98 90 C100 88 104 88 106 90" stroke-width="1.2" />

      <!-- Left arm resting -->
      <path d="M42 102 C36 108 32 106 30 100" stroke-width="1.2" />
      <ellipse cx="29" cy="99" rx="3" ry="3.5" fill="url(#skinGrad)" stroke-width="1" />
    </g>
  </svg></div>
</body></html>
